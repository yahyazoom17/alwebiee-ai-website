<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Alwebiee — icon</title>
  <!-- Symbol ink scaled to 168 units on a 256 canvas (~44-unit
       margin on each side, inside the safe zone for circular social-avatar crops). -->
  <rect x="0" y="0" width="256" height="256" fill="#0F7A4F"/>
  <g transform="translate(12.39,12.39) scale(0.9032)">

  <title id="t">Alwebiee — The Woven Frame (master, filled outlines)</title>
  <!-- Production master for Concept A. Same geometry as a-woven-frame-v3.svg but with
       every stroke expanded to a filled outline, so the mark scales and cuts predictably
       (no stroke-width to re-round, no hairlines to trap). Ring centre lines 80/176,
       frame outer edge 66..190, corner radius 34, stroke 28, thread ends overshoot 31,
       under-thread cut by a 5-unit seam either side of the over-thread. Single colour. -->
  <path fill="#ffffff" fill-rule="nonzero" d="
    M 35 66 L 142 66 A 48 48 0 0 1 190 114 L 190 157 L 162 157 L 162 114 A 20 20 0 0 0 142 94 L 35 94 Z
    M 221 190 L 114 190 A 48 48 0 0 1 66 142 L 66 99 L 94 99 L 94 142 A 20 20 0 0 0 114 162 L 221 162 Z
    M 162 195 L 190 195 L 190 221 L 162 221 Z
    M 66 35 L 94 35 L 94 61 L 66 61 Z
  "/>
  </g>
</svg>
