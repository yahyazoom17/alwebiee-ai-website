<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Alwebiee — The Woven Frame</title>
  <!-- Two threads on one rounded-square frame. At the top-left and bottom-right
       the vertical thread passes UNDER the horizontal one (broken with a 3-unit
       seam) and both tips poke past the crossing. Stacked thread. -->
  <g fill="none" stroke="#111" stroke-width="26" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M 22 58 H 158 A 40 40 0 0 1 198 98 V 182"/>
    <path d="M 198 214 V 234"/>
    <path d="M 234 198 H 98 A 40 40 0 0 1 58 158 V 74"/>
    <path d="M 58 42 V 22"/>
  </g>
</svg>
